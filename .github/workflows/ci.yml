name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck -s bash -S warning secrets-bridge.sh install.sh providers/*.sh outputs/*.sh tests/*.sh

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Check out the secrets library (dependency)
        uses: actions/checkout@v7
        with:
          repository: nuvemlabs/secrets
          ref: v1.1.1
          path: .deps/secrets
      - name: Test suites
        env:
          SECRETS_LIB_PATH: ${{ github.workspace }}/.deps/secrets/secrets.sh
        run: |
          failed=0
          for t in tests/test_*.sh; do
            echo "::group::$t"
            bash "$t" || failed=1
            echo "::endgroup::"
          done
          exit "$failed"
